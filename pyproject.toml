[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.2.0"
description = "Agentic factor mining: panel data -> hypothesis -> expression/script -> grid backtest -> factor pool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=14",
    "requests>=2.28",
    "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=8"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
include = ["factorlab*"]
