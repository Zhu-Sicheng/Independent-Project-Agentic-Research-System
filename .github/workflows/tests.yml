name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI
        run: |
          python -m factorlab gen-data --tickers 60 --start 2021-01-01 --end 2023-12-31
          python -m factorlab expr --expression="-rank(ts_mean(returns, 5))" --start 2021-01-01 --end 2023-12-31
